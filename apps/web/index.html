<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tenK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Apply saved theme before React renders to prevent flash -->
    <script>
      /* Inject CSS variables as inline styles on <html> — specificity [1,0,0,0],
         overrides every stylesheet rule. Keeps Tailwind utility classes in sync. */
      (function(){
        var T={
          dark:{
            '--bg-deep':'#08081a','--bg-card':'#0d0d1f','--bg-surface':'#101026',
            '--bg-elevated':'#12122a','--color-border':'#1e1e3a','--border-dim':'#14142a',
            '--text-primary':'#ffffff','--text-secondary':'#cccccc',
            '--text-muted':'#555555','--text-dim':'#2e2e52',
            '--scrollbar-track':'#0d0d1f','--scrollbar-thumb':'#1e1e3a',
            '--scrollbar-thumb-hover':'#2e2e52'
          },
          light:{
            '--bg-deep':'#f0f0f9','--bg-card':'#ffffff','--bg-surface':'#f8f8ff',
            '--bg-elevated':'#ebebf8','--color-border':'#d8d8ee','--border-dim':'#e5e5f5',
            '--text-primary':'#0a0a20','--text-secondary':'#2a2a4a',
            '--text-muted':'#7070a0','--text-dim':'#b0b0cc',
            '--scrollbar-track':'#f0f0f9','--scrollbar-thumb':'#d8d8ee',
            '--scrollbar-thumb-hover':'#c0c0e0'
          }
        };
        var t=localStorage.getItem('tenk-theme')||'light';
        var vars=T[t]||T.light;
        var root=document.documentElement;
        for(var k in vars) root.style.setProperty(k,vars[k]);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
