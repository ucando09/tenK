<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gold gradient: bright at the peak tips, deep amber at the base -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFE040"/>
      <stop offset="38%"  stop-color="#F0AC00"/>
      <stop offset="100%" stop-color="#7A4A00"/>
    </linearGradient>

    <!-- Sun glow that bleeds out from between the two tips -->
    <radialGradient id="sun" cx="50%" cy="5%" r="48%" fx="50%" fy="4%">
      <stop offset="0%"   stop-color="#FFE870" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#FFD030" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFD030" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle inner shadow along each triangle's inner edge -->
    <linearGradient id="shadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="shadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Deep dark background -->
  <rect width="512" height="512" fill="#08081a"/>

  <!-- Sun glow — the light source between the two peaks -->
  <ellipse cx="256" cy="30" rx="170" ry="130" fill="url(#sun)"/>

  <!-- ── Left mountain ── -->
  <!-- Outer shape -->
  <polygon points="22,494 246,494 188,26" fill="url(#gold)"/>
  <!-- Inner shadow (right face of left peak) -->
  <polygon points="246,494 188,26 220,494" fill="url(#shadeL)" opacity="0.5"/>

  <!-- ── Right mountain ── -->
  <!-- Outer shape -->
  <polygon points="266,494 490,494 324,26" fill="url(#gold)"/>
  <!-- Inner shadow (left face of right peak) -->
  <polygon points="266,494 324,26 292,494" fill="url(#shadeR)" opacity="0.5"/>
</svg>
