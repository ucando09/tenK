<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFE040"/>
      <stop offset="38%"  stop-color="#F0AC00"/>
      <stop offset="100%" stop-color="#7A4A00"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="6%" r="55%">
      <stop offset="0%"   stop-color="#FFE870" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFE870" stop-opacity="0"/>
    </radialGradient>
    <!-- Shade on inner edges of each triangle -->
    <linearGradient id="shL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="shR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Transparent background — picks up the surrounding theme color. -->

  <!-- Sun glow between peaks -->
  <ellipse cx="50" cy="5" rx="33" ry="26" fill="url(#sun)"/>

  <!-- ── Mountains (scaled from 512×512 to 98×98) ── -->
  <!-- Scale: 98/512 ≈ 0.1914 -->
  <!-- Left mountain:  22,494 → 4,94  |  246,494 → 47,94  |  188,26 → 36,5 -->
  <polygon points="4,95 47,95 36,5"  fill="url(#gold)"/>
  <polygon points="47,95 36,5 43,95" fill="url(#shL)" opacity="0.5"/>

  <!-- Right mountain: 266,494 → 51,94 | 490,494 → 94,94 | 324,26 → 62,5 -->
  <polygon points="51,95 94,95 62,5"  fill="url(#gold)"/>
  <polygon points="51,95 62,5  57,95" fill="url(#shR)" opacity="0.5"/>

  <!-- ── Wordmark ── -->
  <!-- "ten" thin  +  "K" heavy — same golden hue -->
  <text
    y="71"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    letter-spacing="-1"
  >
    <tspan x="112" font-size="54" font-weight="200" fill="#F0AC00">ten</tspan><tspan
      font-size="54" font-weight="800" fill="#FFE040">K</tspan>
  </text>
</svg>
